# Task009 — encrypted remote backup (repository scaffolding; activation-safety hardened in 007A).
#
# Activation model (see docs/TASK009_RESTORE_RUNBOOK.md, sections 007A/007B):
#   - schedule           : runs the LIVE backup ONLY when repo variable TASK009_BACKUP_ENABLED == 'true'.
#                          schedule NEVER dry-runs; when disabled it is SKIPPED.
#   - workflow_dispatch  : boolean input `dry_run` (default true).
#       * dry_run = true  -> DRY-RUN, allowed even when disabled; reads NO secrets, connects to NO DB/R2,
#                            queries nothing, encrypts nothing, uploads nothing (orchestrator -DryRun).
#       * dry_run = false -> LIVE backup ONLY when TASK009_BACKUP_ENABLED == 'true'; else SKIPPED.
#   The run/skip/mode decision is computed by scripts/backup/task009_workflow_gate.sh (fail-closed).
#
# The job binds the dedicated GitHub Environment `task009-backup` (Environment secrets are provisioned by the
# operator in Task009-007B; NO values live in this repo). It NEVER runs on pull_request. Live backup uploads
# ONLY an age-encrypted archive + desensitized manifest/checksum to a private Cloudflare R2 bucket and performs
# NO remote deletion (30-day retention = R2 lifecycle, configured in 007B). age PRIVATE identity is NEVER in GitHub.
#
# NOTE: a Public repository may disable scheduled workflows after 60 days of inactivity. Keep the manual
# "Run workflow" button and do the monthly check in the runbook to re-enable if needed.
name: Task009 Encrypted Remote Backup

on:
  schedule:
    # 03:17 Asia/Taipei == 19:17 UTC (avoids top-of-hour peaks)
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no DB/R2 connection, no upload). Default true. Set false for a LIVE backup (requires TASK009_BACKUP_ENABLED=true)."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: task009-encrypted-remote-backup
  cancel-in-progress: false

jobs:
  encrypted-remote-backup:
    name: Encrypted remote backup
    runs-on: ubuntu-latest
    # Dedicated environment: Environment secrets are scoped here and provisioned by the operator in 007B.
    environment: task009-backup
    timeout-minutes: 30
    # Default branch only, and only for schedule/manual. The run/skip and dry-run/live decision
    # is made by the gate step below (schedule & manual-live require TASK009_BACKUP_ENABLED=true;
    # manual dry-run is allowed even when disabled).
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@v4

      - name: Resolve activation gate (fail-closed)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKUP_ENABLED: ${{ vars.TASK009_BACKUP_ENABLED }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: bash ./scripts/backup/task009_workflow_gate.sh

      - name: Skipped (disabled or not permitted for this event/mode)
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "Task009 backup SKIPPED. event=${{ github.event_name }} mode=${{ steps.gate.outputs.mode }} enabled=${{ vars.TASK009_BACKUP_ENABLED }}"
          echo "No DB/R2 connection, no query, no upload."

      - name: Manual dry-run (no secrets, no DB/R2, no upload)
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.mode == 'dryrun'
        shell: pwsh
        # NOTE: intentionally NO secret/DB/R2 env here. Orchestrator -DryRun returns before Require-Env,
        # so no secrets are read and nothing connects/uploads.
        run: >-
          ./scripts/backup/task009_remote_backup.ps1
          -WorkRoot "$env:RUNNER_TEMP"
          -RunId "${{ github.run_id }}"
          -DryRun

      - name: Install and verify required tools (live only; no secrets printed)
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.mode == 'live'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client age tar
          pg_dump --version
          pg_restore --version
          psql --version
          age --version
          tar --version | head -n1

      - name: Install pinned AWS CLI v2 (live only; deterministic S3 client)
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.mode == 'live'
        env:
          AWSCLI_VERSION: "2.15.30"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" -o "$tmp/awscliv2.zip"
          unzip -q "$tmp/awscliv2.zip" -d "$tmp"
          sudo "$tmp/aws/install" --update
          rm -rf "$tmp"
          installed="$(aws --version 2>&1 || true)"
          echo "$installed"
          case "$installed" in
            *"aws-cli/${AWSCLI_VERSION}"*) echo "AWS CLI pinned version ${AWSCLI_VERSION} verified" ;;
            *) echo "ERROR: AWS CLI version mismatch (expected aws-cli/${AWSCLI_VERSION})"; exit 1 ;;
          esac

      - name: Run live encrypted remote backup (enabled only)
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.mode == 'live'
        shell: pwsh
        env:
          # DB connection — Environment secrets provisioned by the operator in 007B; values never printed.
          PGHOST: ${{ secrets.TASK009_PGHOST }}
          PGPORT: ${{ secrets.TASK009_PGPORT }}
          PGDATABASE: ${{ secrets.TASK009_PGDATABASE }}
          PGUSER: ${{ secrets.TASK009_PGUSER }}
          PGPASSWORD: ${{ secrets.TASK009_PGPASSWORD }}
          PGSSLMODE: require
          # age recipient PUBLIC key (non-secret variable). Private identity is NEVER in GitHub.
          AGE_RECIPIENT: ${{ vars.TASK009_AGE_RECIPIENT }}
          # Private R2 bucket + endpoint (variables) and bucket-scoped R/W token (Environment secrets)
          R2_BUCKET: ${{ vars.TASK009_R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.TASK009_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.TASK009_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.TASK009_R2_SECRET_ACCESS_KEY }}
        run: >-
          ./scripts/backup/task009_remote_backup.ps1
          -WorkRoot "$env:RUNNER_TEMP"
          -RunId "${{ github.run_id }}"
        # The orchestrator cleans up its own precise run-specific directory (runner-temp containment)
        # in a finally block on success or failure. No wildcard cleanup here.
