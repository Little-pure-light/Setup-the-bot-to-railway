name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key
      SUPABASE_URL: http://mock.supabase.local
      SUPABASE_ANON_KEY: test-key
      SUPABASE_KEY: test-key
      API_SECRET: ""
      MODERATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest
        run: pytest -q --cov=backend --cov=modules --cov-report=term-missing
      - name: pip-audit (warn only)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
      - name: npm audit (warn only)
        continue-on-error: true
        run: npm audit --audit-level=high || true

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npx playwright test --project="Desktop Chrome"
        env:
          CI: "true"
          VITE_API_URL: http://127.0.0.1:5173

  task009-powershell-safety:
    name: Task009 PowerShell safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Task009 PowerShell safety tests
        shell: pwsh
        run: ./tests/powershell/task009_safety_tests.ps1

  task009-remote-backup-safety:
    name: Task009 remote backup safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Task009 remote backup safety tests
        shell: pwsh
        run: ./tests/powershell/task009_remote_backup_tests.ps1

  task009-workflow-gate:
    name: Task009 workflow activation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Task009 activation gate matrix tests
        run: bash ./tests/workflow/task009_gate_matrix_tests.sh

  task009-pg17-client-contract:
    name: Task009 PG17 client contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PG17 client static contract tests
        run: bash ./tests/workflow/task009_pg17_client_contract_tests.sh

  task009-pg17-client-install:
    name: Task009 PG17 client install proof
    runs-on: ubuntu-latest
    # Real-runner proof that the exact same installer the live workflow uses yields
    # major-17 client binaries. Uses NO production secrets, DB, R2, age recipient, or gate.
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client (official PGDG; no secrets)
        run: bash ./scripts/backup/install_pg17_client.sh
      - name: Prove exported major-17 tool paths exist (no secrets/DB/R2)
        run: |
          set -euo pipefail
          for var in PSQL_PATH PG_DUMP_PATH PG_RESTORE_PATH; do
            path="${!var:-}"
            [ -n "$path" ] || { echo "MISSING_EXPORT ${var}"; exit 1; }
            case "$path" in
              /usr/lib/postgresql/17/bin/*) : ;;
              *) echo "UNEXPECTED_PATH ${var}"; exit 1 ;;
            esac
            [ -x "$path" ] || { echo "MISSING_BINARY ${var}"; exit 1; }
            ver="$("$path" --version)"
            major="$(printf '%s' "$ver" | grep -oE '[0-9]+' | head -n1)"
            [ "$major" = "17" ] || { echo "BAD_MAJOR ${var}=${major}"; exit 1; }
            echo "$ver"
          done
          echo "PG17_CLIENT_PATHS_VERIFIED"

  task009-age-roundtrip:
    name: Task009 age encrypt round-trip proof
    runs-on: ubuntu-latest
    # Real-runner proof that the age binary can parse a recipient and round-trip, using a
    # TEMPORARY generated keypair only. Uses NO production recipient/secret/private key, no
    # DB, no R2, no live gate. Isolates whether an age_encrypt live failure is code/binary
    # (would fail here too) vs. the production recipient value (would pass here).
    steps:
      - uses: actions/checkout@v4
      - name: Install age (no secrets)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
      - name: Age encrypt/decrypt round-trip with a temporary keypair
        run: bash ./scripts/backup/verify_age_roundtrip.sh

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
